[project]
name = "rockon"
version = "0.7.5"
description = "Hyper customized Rocktreff data entry and lists thingamajig"
authors = [{ name = "ethrgeist", email = "knuth@ethergeist.de" }]
requires-python = ">=3.14.0,<4"
readme = "README.md"
license = "GPL-3.0-or-later"
dependencies = [
    "blessed",
    "brotli",
    "channels[daphne]",
    "channels-redis",
    "dateparser",
    "django",
    "django-autoslug",
    "django-compressor",
    "django-libsass",
    "django-cors-headers",
    "django-extensions",
    "django-health-check",
    "django-q2",
    "django-redis",
    "environs[django]",
    "gunicorn",
    "markdown",
    "nh3",
    "pillow",
    "redis[hiredis]",
    "sentry-sdk[django]",
    "tzdata",
    "python-slugify[unidecode]",
    "djlint",
    "django-ninja",
    "openpyxl>=3.1.5",
    "webauthn>=2.7.1",
]

[dependency-groups]
dev = [
    "django-debug-toolbar",
    "pre-commit",
    "ruff",
    "jupyter",
    "ipython",
    "pytest",
    "pytest-django",
    "pytest-cov",
]

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint.per-file-ignores]
# Django migrations are autogenerated and shouldn't be hand-edited; the
# mutable class attrs (options/bases dicts) they contain are safe as-is.
"**/migrations/*.py" = ["RUF012"]
# django-ninja requires calling File()/Query()/etc. in the parameter default
# to declare how the value is sourced from the request.
"src/rockon/api/endpoints/band_media.py" = ["B008"]
"src/rockon/api/endpoints/exhibitor_signup.py" = ["B008"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "rockon.settings"
pythonpath = ["src"]
testpaths = ["src"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*", "*Tests"]
addopts = [
    "--cov=rockon",
    "--cov-report=term-missing",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
